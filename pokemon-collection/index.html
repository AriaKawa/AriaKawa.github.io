<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111515">
    <meta
        name="description"
        content="Browse AriaKawa's Pokémon card collection with live TCGplayer market prices."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="Pokémon Card Collection — AriaKawa">
    <meta property="og:description" content="Browse 101 unique cards from AriaKawa's personal Pokémon TCG collection.">
    <meta property="og:url" content="https://ariakawa.github.io/pokemon-collection/">
    <meta property="og:image" content="https://ariakawa.github.io/pokemon-collection/og.png">
    <meta property="og:image:width" content="1536">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="AriaKawa Pokémon Collection with five abstract elemental trading cards">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pokémon Card Collection — AriaKawa">
    <meta name="twitter:description" content="Browse 101 unique cards from AriaKawa's personal Pokémon TCG collection.">
    <meta name="twitter:image" content="https://ariakawa.github.io/pokemon-collection/og.png">
    <title>Pokémon Card Collection — AriaKawa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.pokemontcg.io">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <nav class="control-rail" aria-label="Collection controls">
            <a class="back-link" href="../other.html" aria-label="Back to the Other projects page">
                <span aria-hidden="true">←</span>
                <span>Project Vault</span>
            </a>

            <div class="control-rail__center">
                <label class="select-control">
                    <span class="sr-only">Filter by set</span>
                    <select id="set-filter">
                        <option value="all">All sets</option>
                    </select>
                </label>

                <label class="select-control">
                    <span class="sr-only">Sort cards</span>
                    <select id="sort-cards">
                        <option value="collection">Collection order</option>
                        <option value="name">Name A–Z</option>
                        <option value="set">Set &amp; number</option>
                        <option value="value-desc">Value: high to low</option>
                        <option value="value-asc">Value: low to high</option>
                    </select>
                </label>
            </div>

            <div class="control-rail__actions">
                <button class="control-button" id="price-checker" type="button" aria-pressed="false">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>Price checker</span>
                </button>
                <button class="control-button" id="show-prices" type="button" aria-pressed="false">
                    Show prices
                </button>
            </div>
        </nav>

        <section>
            <h2 class="sr-only">Cards</h2>
            <div class="card-grid" id="card-grid" role="list"></div>
            <div class="empty-state" id="empty-state" hidden>
                <span class="empty-state__orb" aria-hidden="true"></span>
                <h2>No cards found</h2>
                <p>Choose another set to keep browsing.</p>
            </div>
        </section>
    </main>

    <dialog class="card-dialog" id="card-dialog" aria-labelledby="dialog-card-name">
        <div class="dialog-shell">
            <button class="dialog-close" id="dialog-close" type="button" aria-label="Close card preview">×</button>
            <button class="dialog-nav dialog-nav--previous" id="dialog-previous" type="button" aria-label="Previous card">←</button>

            <div class="dialog-card-image">
                <img id="dialog-image" alt="">
            </div>

            <div class="dialog-details">
                <p class="dialog-kicker" id="dialog-set"></p>
                <h2 id="dialog-card-name"></h2>
                <p class="dialog-number" id="dialog-number"></p>
                <p class="dialog-quantity" id="dialog-quantity"></p>
                <p class="dialog-variant" id="dialog-variant"></p>
                <div class="dialog-market">
                    <span class="dialog-price" id="dialog-price"></span>
                    <a id="dialog-market-link" target="_blank" rel="noopener noreferrer">View on TCGplayer ↗</a>
                </div>
                <p class="dialog-hint">Use the arrow keys to move through the collection.</p>
            </div>

            <button class="dialog-nav dialog-nav--next" id="dialog-next" type="button" aria-label="Next card">→</button>
        </div>
    </dialog>

    <div class="card-count" id="total-card-count" aria-label="Total card count">106 cards</div>

    <script src="inventory.js"></script>
    <script src="app.js"></script>
    <script src="../site-navigation.js"></script>
</body>
</html>
