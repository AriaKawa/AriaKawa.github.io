  <style>
    body.booting{margin:0;background:#10271e;overflow:hidden}body.booting>:not(#boot-loader):not(script):not(style){visibility:hidden!important}

    .boot-progress-label{display:flex;justify-content:space-between;gap:16px;margin-top:18px;color:#d3e6b7;font:13px system-ui,sans-serif}.boot-hint{color:#96b599;font:12px/1.6 system-ui,sans-serif;margin-top:12px}.boot-retry{padding:10px 20px;background:#9fc879;color:#11271c;border:0;border-radius:7px;font:600 14px system-ui,sans-serif;cursor:pointer}.boot-retry[hidden]{display:none}
