<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181c2e"><meta name="description" content="BUNGERMAN. An animated peanut arcade showdown."><title>BUNGERMAN</title><link rel="stylesheet" href="style.css?v=hat"></head>
<body><main class="cabinet"><img class="cabinet-art" src="assets/arcade2005/cabinet-v2.png" alt="BUNGERMAN arcade cabinet" draggable="false">
<div class="hat-perch" aria-hidden="true"><img class="top-hat" src="assets/arcade2005/top-hat.png" alt="" draggable="false"></div><header><canvas id="logo" width="320" height="84" role="img" aria-label="BUNGERMAN"></canvas></header>
<section class="machine" aria-label="Game">
<div class="hud"><div class="player-hud"><canvas id="hud-face" width="32" height="36" aria-hidden="true"></canvas><span id="hearts" aria-label="3 health">♥♥♥</span></div><strong id="score" aria-label="Score">00000</strong><div class="time"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 0h8v2H4zM2 4h2V2h8v2h2v10h-2v2H4v-2H2zm5 1v5h5V8H9V5z"/></svg><strong id="timer">75</strong></div><button id="sound" class="icon-button" aria-label="Enable sound" aria-pressed="false" title="Sound"><span id="sound-icon" aria-hidden="true">♪</span><span id="sound-off" aria-hidden="true">×</span></button><button id="pause" class="icon-button" aria-label="Pause" disabled>Ⅱ</button></div>
<div class="screen"><canvas id="game" width="416" height="352" tabindex="0" aria-label="Game arena. Move with WASD or arrow keys. Hold Space to charge a bomb, release to throw. Escape pauses."></canvas>
<div id="menu" class="menu" data-view="select"><div id="select-view" class="menu-view">
<div id="pack-status" role="status"></div><button id="retry-assets" class="secondary-button" hidden>RETRY</button>
<div class="roster" role="group" aria-label="Choose character">
<button class="character selected" data-character="peanut" aria-pressed="true" aria-label="Burnt Peanut. Extra blast range." title="Burnt Peanut: extra blast range"><canvas class="portrait" data-portrait="peanut" width="88" height="100" aria-hidden="true"></canvas><span>PEANUT</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="hutch" aria-pressed="false" aria-label="HutchMF. Hold to charge, release to throw." title="HutchMF: hold to charge, release to throw"><canvas class="portrait" data-portrait="hutch" width="88" height="100" aria-hidden="true"></canvas><span>HUTCHMF</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="ninja" aria-pressed="false" aria-label="Ninja. Faster movement." title="Ninja: faster movement"><canvas class="portrait" data-portrait="ninja" width="88" height="100" aria-hidden="true"></canvas><span>NINJA</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="tpain" aria-pressed="false" aria-label="T-Pain. Balanced speed and bomb control." title="T-Pain: balanced speed and bomb control"><canvas class="portrait" data-portrait="tpain" width="88" height="100" aria-hidden="true"></canvas><span>T-PAIN</span><i aria-hidden="true">▼</i></button>
</div><button id="play" class="pixel-button">PLAY <span aria-hidden="true">▶</span></button><div class="best" title="Personal best" aria-label="Personal best"><span aria-hidden="true">★</span><span id="best">00000</span></div>
</div><div id="state-view" class="menu-view" hidden><canvas id="menu-art" width="160" height="124" aria-hidden="true"></canvas><h1 id="state-title">PAUSED</h1><p id="state-score" hidden></p><button id="continue" class="pixel-button">RESUME <span aria-hidden="true">▶</span></button><button id="change-character" class="secondary-button" aria-label="Return to character selection">CHARACTERS</button></div></div><div id="hit-feedback" aria-hidden="true"></div><div id="toast" class="toast" role="status"></div>
</div><span id="round" class="round-badge" aria-label="Round 1 of 3">1 / 3</span>
</section>
<div class="deck-controls" aria-label="Arcade controls">
<div id="joystick" tabindex="0" role="group" aria-label="Joystick: drag to move, or use arrow keys"><span class="joystick-nub" aria-hidden="true"></span></div>
<button id="touch-bomb" aria-label="Hold to charge a bomb, release to throw" title="Hold to charge, release to throw"></button>
</div>
</main><script type="module" src="game.js?v=hat"></script></body></html>
