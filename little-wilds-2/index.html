<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f2a24"><title>Little Wilds 2</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2352904a'/%3E%3Cpath d='M8 13V7M8 8C5 8 4 6 4 4c3 0 4 1 4 4m0 0c3 0 4-2 4-4-3 0-4 1-4 4' stroke='%23fff6df' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" tabindex="0" aria-label="A dead continent. Hold and drag to bring the land back. Drag a spirit to carry it. Right-drag or arrow keys pan; wheel or plus and minus zoom."></canvas>
<div id="hud">
 <div class="seeds" title="Seeds"><span class="ico ico-seed"></span><b id="seeds">0</b><small id="rate"></small></div>
 <button class="zonechip" id="zonechip" title="Open the valley map"><span id="zone-name">Hearthfield</span><span class="bar"><i id="zone-bar"></i><u id="bloom-bar"></u></span><small id="zone-note"></small></button>
 <div class="tools"><button id="btn-map" title="The whole map (M)">Map</button><button id="btn-preview" title="Preview the whole continent restored (P). Press again to go back." aria-pressed="false">Preview</button><button id="btn-then" title="Compare then and now">Then / Now</button><button id="btn-sound" title="Sound" aria-pressed="false">Sound</button><button id="btn-menu" title="Menu">Menu</button></div>
 <div id="dock"></div>
</div>
<div id="hint" hidden></div>
<div id="banner" aria-live="polite"><strong id="banner-title"></strong><span id="banner-sub"></span></div>
<div id="toast" role="status"></div>
<dialog id="modal"><button id="close" aria-label="Close">×</button><div id="modal-body"></div></dialog>
<div id="loading" role="status"><strong>Little Wilds 2</strong><span>The valley is waking…</span></div>
<script type="module" src="game.mjs?v=18"></script></body></html>
