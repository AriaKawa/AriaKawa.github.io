<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#242424"><meta name="description" content="BUNGERMAN. An animated peanut arcade showdown."><title>BUNGERMAN</title><link rel="stylesheet" href="style.css?v=larger8"></head>
<body><main class="cabinet"><img class="cabinet-art" src="assets/runtime/cabinet-v7.webp" alt="BUNGERMAN arcade cabinet" draggable="false">
<header><canvas id="logo" width="320" height="84" role="img" aria-label="BUNGERMAN"></canvas></header>
<section class="machine" aria-label="Game">
<div class="hud"><div class="player-hud"><canvas id="hud-face" width="32" height="36" aria-hidden="true"></canvas><span id="hearts" aria-label="3 health">♥♥♥</span></div><strong id="score" aria-label="Score">00000</strong><div class="time"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 0h8v2H4zM2 4h2V2h8v2h2v10h-2v2H4v-2H2zm5 1v5h5V8H9V5z"/></svg><strong id="timer">75</strong></div><button id="sound" class="icon-button" aria-label="Enable sound" aria-pressed="false" title="Sound"><span id="sound-icon" aria-hidden="true">♪</span><span id="sound-off" aria-hidden="true">×</span></button><button id="pause" class="icon-button" aria-label="Pause" disabled>Ⅱ</button></div>
<div class="screen"><canvas id="game" width="416" height="352" tabindex="0" aria-label="Game arena. Move with WASD or arrow keys. Press Space to plant two bombs at a time. E fires an RPG. Escape pauses. Touch: drag to move; tap to plant a bomb."></canvas>
<div id="menu" class="menu" data-view="select"><div id="select-view" class="menu-view">
<div id="pack-status" role="status"></div><button id="retry-assets" class="secondary-button" hidden>RETRY</button>
<div class="roster" role="group" aria-label="Choose character">
<button class="character selected" data-character="peanut" aria-pressed="true" aria-label="Burnt Peanut. Extra blast range." title="Burnt Peanut: extra blast range"><canvas class="portrait" data-portrait="peanut" width="88" height="100" aria-hidden="true"></canvas><span>PEANUT</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="hutch" aria-pressed="false" aria-label="Hutch. Plant two bombs at a time." title="Hutch: plant two bombs at a time"><canvas class="portrait" data-portrait="hutch" width="88" height="100" aria-hidden="true"></canvas><span>HUTCH</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="ninja" aria-pressed="false" aria-label="Ninja. Faster movement." title="Ninja: faster movement"><canvas class="portrait" data-portrait="ninja" width="88" height="100" aria-hidden="true"></canvas><span>NINJA</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="tpain" aria-pressed="false" aria-label="T-Pain. Balanced speed and bomb control." title="T-Pain: balanced speed and bomb control"><canvas class="portrait" data-portrait="tpain" width="88" height="100" aria-hidden="true"></canvas><span>T-PAIN</span><i aria-hidden="true">▼</i></button>
</div><div class="map-picker" role="group" aria-label="Choose map"><button data-map="garden" aria-pressed="true" aria-label="Garden map"><canvas data-map-preview="garden" aria-hidden="true"></canvas><span>GARDEN</span></button><button data-map="foundry" aria-pressed="false" aria-label="Foundry map"><canvas data-map-preview="foundry" aria-hidden="true"></canvas><span>FOUNDRY</span></button><button data-map="neon" aria-pressed="false" aria-label="Neon map"><canvas data-map-preview="neon" aria-hidden="true"></canvas><span>NEON</span></button></div><button id="play" class="pixel-button">PLAY <span aria-hidden="true">▶</span></button><div class="best" title="Personal best" aria-label="Personal best"><span aria-hidden="true">★</span><span id="best">00000</span></div>
</div><div id="state-view" class="menu-view" hidden><canvas id="menu-art" width="160" height="124" aria-hidden="true"></canvas><h1 id="state-title">PAUSED</h1><p id="state-score" hidden></p><button id="continue" class="pixel-button">RESUME <span aria-hidden="true">▶</span></button><button id="change-character" class="secondary-button" aria-label="Return to character selection">CHARACTERS</button></div></div><button id="rpg-fire" hidden title="Fire RPG · E" aria-label="Fire RPG"><img src="assets/runtime/rpg.webp" alt=""><span id="rpg-ammo">3</span><kbd>E</kbd></button><div id="hit-feedback" aria-hidden="true"></div><div id="toast" class="toast" role="status"></div>
</div><span id="round" class="round-badge" aria-label="Round 1 of 3">1 / 3</span>
</section>
<div class="deck-controls"><div id="joystick" role="group" aria-label="Drag joystick to move"></div><button id="touch-bomb" aria-label="Plant bomb" title="Plant bomb · Space"></button><button id="touch-rpg" aria-label="Fire RPG" title="Fire RPG � E"></button></div></main><script type="module" src="game.js?v=front7"></script></body></html>
