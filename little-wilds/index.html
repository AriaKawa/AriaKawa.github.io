<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#293b28"><title>Little Wilds</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" tabindex="0" aria-label="Dirt field. Hold to plant. Drag a spirit to pick it up and place it. Drag empty ground to pan. Wheel or pinch to zoom. Arrow keys pan; plus and minus zoom."></canvas>
<div class="resources" aria-label="Resources"><div class="counter" title="Seeds"><span class="icon seed"></span><b id="seeds">0</b></div><div class="counter" title="Dew"><span class="icon water"></span><b id="dew">0</b></div><div class="counter" title="Memories"><span class="icon memory"></span><b id="memories">0</b></div></div>
<div class="tools"><button class="art-button art-portrait" id="land" title="Land expansions" aria-label="Land expansions"><span class="land-icon" aria-hidden="true">&#9638;</span></button><button class="art-button art-pause" id="pause" title="Pause" aria-label="Pause"></button><button class="art-button art-fullscreen" id="fullscreen" title="Fullscreen" aria-label="Fullscreen"></button><button class="art-button art-settings" id="settings" title="Settings" aria-label="Settings"></button></div>
<div class="progress-hud" title="Restored"><span class="icon plant"></span><b id="percent">0.0%</b><div class="progress"><i id="landbar"></i></div></div>
<div class="actions"><button class="art-button art-tree" id="tree" title="Upgrades" aria-label="Upgrades"></button><button class="art-button art-rebirth" id="prestige" title="Prestige" aria-label="Prestige"><span id="rebirth-badge"></span></button></div>
<div id="spirit-dock" aria-label="Summon spirits"></div><div id="cursor" hidden><img src="assets/cursor.png" alt=""><span id="charge"></span></div>
<div id="loading" role="status">Loading…</div><div id="toast" role="status"></div><dialog id="modal"><button id="close-modal" class="art-button art-close" aria-label="Close"></button><div id="modal-content"></div></dialog><script type="module" src="game.mjs"></script></body></html>
