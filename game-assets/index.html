<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Assets</title>
<style>
:root{--bg:#0d0c11;--card:#17161d;--ink:#f4efe6;--muted:#a7a2b3;--stage:#a8d098;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 48px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:auto;display:grid;gap:16px}
a{color:inherit}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--ink)}
h1{margin:8px 0 0;font-size:30px}p{margin:0;color:var(--muted)}
section{background:var(--card);border-radius:12px;padding:16px;display:grid;gap:12px}
h2{margin:0;font-size:19px}
.set{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
figure{margin:0;background:var(--stage);border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;max-width:100%}
figcaption{color:#20302a;font-size:13px;font-weight:600}
img{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.frames{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.frames span{width:100%}.frames a{background:var(--stage);border-radius:6px;padding:4px}
</style></head><body><main>
<a class="back" href="../">&larr; AriaKawa</a>
