<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181c2e"><meta name="description" content="BUNGERMAN. Three arcade art styles. One explosive peanut showdown."><title>BUNGERMAN</title><link rel="stylesheet" href="style.css"></head>
<body><main class="cabinet">
<header><canvas id="logo" width="320" height="84" role="img" aria-label="BUNGERMAN"></canvas><div class="top-actions"><button id="sound" class="icon-button" aria-label="Enable sound" aria-pressed="false" title="Sound"><span id="sound-icon" aria-hidden="true">♪</span><span id="sound-off" aria-hidden="true">×</span></button><button id="home" class="icon-button" aria-label="Return to character selection" title="Characters"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v2h2v2h2v2h2v2h-2v6H9v-4H7v4H3V9H1V7h2V5h2V3h2z"/></svg></button></div></header>
<section class="machine" aria-label="Game">
<div class="hud"><div class="player-hud"><canvas id="hud-face" width="32" height="36" aria-hidden="true"></canvas><span id="hearts" aria-label="3 health">♥♥♥</span></div><strong id="score" aria-label="Score">00000</strong><div class="time"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 0h8v2H4zM2 4h2V2h8v2h2v10h-2v2H4v-2H2zm5 1v5h5V8H9V5z"/></svg><strong id="timer">75</strong></div><button id="pause" class="icon-button" aria-label="Pause" disabled>Ⅱ</button></div>
<div class="screen"><canvas id="game" width="416" height="352" tabindex="0" aria-label="Game arena. Move with WASD or arrow keys. Hold Space to charge a bomb, release to drop. Escape pauses."></canvas>
<div id="menu" class="menu" data-view="select"><div id="select-view" class="menu-view">
<div class="style-picker" role="group" aria-label="Art style"><button data-style="16bit" aria-pressed="false">16-BIT</button><button data-style="64bit" aria-pressed="false">64-BIT</button><button data-style="cartoon" aria-pressed="false">CARTOON</button></div><div id="pack-status" role="status"></div>
<div class="roster" role="group" aria-label="Choose character">
<button class="character selected" data-character="peanut" aria-pressed="true" aria-label="Burnt Peanut. Extra blast range." title="Burnt Peanut: extra blast range"><canvas class="portrait" data-portrait="peanut" width="88" height="100" aria-hidden="true"></canvas><span>PEANUT</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="hutch" aria-pressed="false" aria-label="HutchMF. More time before overcooking." title="HutchMF: more time before overcooking"><canvas class="portrait" data-portrait="hutch" width="88" height="100" aria-hidden="true"></canvas><span>HUTCHMF</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="ninja" aria-pressed="false" aria-label="Ninja. Faster movement." title="Ninja: faster movement"><canvas class="portrait" data-portrait="ninja" width="88" height="100" aria-hidden="true"></canvas><span>NINJA</span><i aria-hidden="true">▼</i></button>
</div><button id="play" class="pixel-button">PLAY <span aria-hidden="true">▶</span></button><div class="best" title="Personal best" aria-label="Personal best"><span aria-hidden="true">★</span><span id="best">00000</span></div>
</div><div id="state-view" class="menu-view" hidden><canvas id="menu-art" width="160" height="124" aria-hidden="true"></canvas><h1 id="state-title">PAUSED</h1><p id="state-score" hidden></p><button id="continue" class="pixel-button">RESUME <span aria-hidden="true">▶</span></button><button id="change-character" class="secondary-button" aria-label="Return to character selection">CHARACTERS</button></div></div><div id="toast" class="toast" role="status"></div>
</div><div class="bottom-hud"><span id="round" aria-label="Round 1 of 3">1 / 3</span><div class="heat" role="meter" aria-label="Bomb heat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="heat-icon" aria-hidden="true">♨</span><div class="heat-track"><div id="heat-fill"></div><b></b><b></b><b></b></div></div><span id="bomb-stock" aria-label="2 bombs available">● ●</span></div>
</section>
<div class="controls-hint" aria-label="WASD or arrow keys to move. Hold Space to charge, release to drop. Escape pauses."><span><kbd>WASD</kbd><span aria-hidden="true"> / </span><kbd>↑↓←→</kbd></span><span><kbd>SPACE</kbd><span class="hint-action"> HOLD → DROP</span></span><span><kbd>ESC</kbd><span class="hint-action"> Ⅱ</span></span></div>
<div class="touch-controls" aria-label="Touch controls"><div class="dpad"><button data-move="up" aria-label="Move up">↑</button><button data-move="left" aria-label="Move left">←</button><button data-move="down" aria-label="Move down">↓</button><button data-move="right" aria-label="Move right">→</button></div><button id="touch-bomb" aria-label="Hold to charge a bomb and release to drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 0h3v3h-3zM20 3h4v3h-4zM14 3h3v4h-3zM8 7h9v3h3v3h2v7h-3v3H5v-3H2v-9h3V9h3z"/><path class="shine" d="M7 11h6v3H7zM5 14h3v4H5z"/></svg></button></div>
<footer>FAN DEMO</footer>
</main><script type="module" src="game.js"></script></body></html>
